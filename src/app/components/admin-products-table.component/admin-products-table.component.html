<div class="container my-4">
  <h2 class="mb-4">Gestione Prodotti Admin</h2>
<div>
  <a routerLink="/admin/user" class="btn btn-sm btn-dark my-4">
               Vai alla gestione degli utenti
              </a>
            </div>

  
  <div class="card p-3 mb-4 bg-light shadow-sm">
    <h5 class="card-title h6 mb-3">Filtra per colonna:</h5>
    
    <form (submit)="onRicerca()"   class="row g-3">
      
      <div class="col-md-3">
        <label for="filtroNome" class="form-label small fw-bold">Nome</label>
        <input 
          type="text" 
          id="filtroNome"
          class="form-control form-control-sm" 
          placeholder="Cerca nome..." 
          [(ngModel)]="filtri.nome" 
          name="nome"
          autocapitalize="off"
        />
      </div>

      
      <div class="col-md-3">
        <label for="filtroDescrizione" class="form-label small fw-bold">Descrizione</label>
        <input 
          type="text" 
          id="filtroDescrizione"
          class="form-control form-control-sm" 
          placeholder="Cerca descrizione..." 
          [(ngModel)]="filtri.descrizioneBreve" 
          name="descrizione"
          autocapitalize="off"
        />
      </div>

      
      <div class="col-md-3">
        <label for="filtrocategoria" class="form-label small fw-bold">Categoria</label>
        <input 
          type="text" 
          id="filtrocategoria"
          class="form-control form-control-sm" 
          placeholder="Cerca categoria..." 
          [(ngModel)]="filtri.categoria" 
          name="categoria"
          autocapitalize="off"
        />
      </div>


      <div class="col-12 d-flex gap-2 justify-content-end mt-3">
        <button type="submit" class="btn btn-primary btn-sm">Filtra</button>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="onReset()">Reset</button>
      </div>
    </form>
  </div>
<app-generic-table [data]="row" [columns]="columns"></app-generic-table>
</div>
