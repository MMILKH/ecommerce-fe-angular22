<div class="card mb-3 p-3 shadow-sm">
  <div class="row align-items-center">
    
  
    <div class="col-md-7">
      <h3 class="h4 mb-1">{{ prodotto.nome }}</h3>
      <p class="text-muted mb-2">{{ prodotto.descrizioneBreve }}</p>
      <p class="fw-bold fs-5 text-primary mb-0">€ {{ prodotto.prezzo }}</p>
    </div>

  
    <div class="col-md-5 text-md-end mt-3 mt-md-0">
      @if (mostraAggiungi) {
        <div class="d-inline-flex gap-2 align-items-center justify-content-md-end">
          
        
          <input 
            type="number" 
            [(ngModel)]="quantita" 
            min="1" 
            max="99"
            class="form-control form-control-sm text-center" 
            style="width: 70px;"
          />

      
          <button 
            type="button" 
            (click)="onAggiungi()" 
            class="btn btn-primary btn-sm d-flex align-items-center gap-1">
            Aggiungi
          </button>

        </div>
      }
    </div>

  </div>
</div>
