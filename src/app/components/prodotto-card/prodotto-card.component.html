<div class="card h-100 shadow-sm">
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ prodotto.nome }}</h5>
    <p class="card-text text-muted flex-grow-1">{{ prodotto.descrizioneBreve }}</p>
    
    <div class="mt-auto">
      <p class="fs-5 fw-bold text-primary mb-2">€{{ prodotto.prezzo }}</p>

      @if (quantita !== undefined) {
        <span class="badge bg-secondary mb-2">Quantità: {{ quantita }}</span>
      } @else {
        <button class="btn btn-primary w-100">Aggiungi al Carrello</button>
      }
    </div>
  </div>
</div>
