<div class="bg-light min-vh-100 d-flex flex-column justify-content-center align-items-center">
  <div style="width: 100%; max-width: 400px;">

    <h2 class="text-center mb-4">Registrati</h2>
    <div class="card border p-4 bg-white">
      
      <form (ngSubmit)="onSubmit()">
        
        <div class="mb-3">
          <label class="form-label" for="nome">Nome</label>
          <input
            class="form-control"
            id="nome"
            name="nome"
            [(ngModel)]="registerData.nome"
            required
          />
        </div>


        <div class="mb-3">
          <label class="form-label" for="cognome">Cognome</label>
          <input
            class="form-control"
            id="cognome"
            name="cognome"
            [(ngModel)]="registerData.cognome"
            required
          />
        </div>

        
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-control"
            type="email"
            id="email"
            name="email"
            [(ngModel)]="registerData.email"
            autocapitalize="off"
            autocomplete="off"
            required
          />
        </div>


        <div class="mb-3">
          <label class="form-label" for="numero">numero</label>
          <input
            class="form-control"
            id="numero"
            name="numero"
            [(ngModel)]="registerData.numero"
            required
          />
        </div>



        <div class="mb-3">
          <label class="form-label" for="indrizzo">indrizzo</label>
          <input
            class="form-control"
            id="indirizzo"
            name="indirizzo"
            [(ngModel)]="registerData.indirizzo"
            required
          />
        </div>


        
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-control"
            type="password"
            id="password"
            name="password"
            [(ngModel)]="registerData.password"
            autocapitalize="off"
            autocomplete="off"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="passwordConf">Ripeti la Password</label>
          <input
            class="form-control"
            type="password"
            id="passwordConf"
            name="passwordConf"
            [(ngModel)]="registerData.passwordConf"
            autocapitalize="off"
            autocomplete="off"
            required
          />
        </div>


       
        <button class="btn btn-dark w-100" type="submit">Registrati</button>

        
        <div class="text-center mt-3">
          <span class="small text-muted d-block mb-2">Hai già un account?</span>
          <a routerLink="/user/login" class="btn btn-outline-dark btn-sm w-100">Accedi</a>
        </div>
      </form>

     @if (errorMessages.length > 0) {
  <div class="alert alert-danger" role="alert">
    @if (errorMessages.length === 1) {
      <span>{{ errorMessages[0] }}</span>
    } @else {
      <ul class="mb-0 ps-3">
        @for (msg of errorMessages; track $index) {
          <li>{{ msg }}</li>
        }
      </ul>
    }
  </div>
}

    </div>
  </div>
</div>
